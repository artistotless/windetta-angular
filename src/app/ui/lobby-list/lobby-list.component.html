<div class="block">
    <p class="card-text">List of current active lobbies:</p>
</div>

@if(lobbies){
<ul>
    @for (item of lobbies; track $index) {
    <div class="block">
        <app-lobby-item (onJoinClick)="onJoinClick($event)" (onLeaveClick)="onLeaveClick($event)"
            [isJoined]="currentLobby.lobbyId === item.id" 
            [currentRoomIndex]="currentLobby.lobbyId === item.id ? currentLobby.roomIndex : 0"
            [info]="item" />
    </div>
    }
</ul>
}@else {
<app-lobby-item-placeholder />
}
